version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ogas_book
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  ahnlich-db:
    image: ghcr.io/deven96/ahnlich-db:latest
    command: >
      "ahnlich-db run --enable-persistence 
      --persistence-interval 300 --host 0.0.0.0"
    ports:
      - ${AHNLICH_DB_PORT}:1369
    volumes:
      - ahnlich-data:/root/.ahnlich
    restart: always

  ahnlich-ai:
    image: ghcr.io/deven96/ahnlich-ai:latest
    command: >
      "ahnlich-ai run --db-host ahnlich-db --db-port 1369
      --supported-models all-minilm-l6-v2"
    ports:
      - ${AHNLICH_AI_PORT}:1370
    depends_on:
      - ahnlich-db
    restart: always

volumes:
  pgdata:
  ahnlich-data:
