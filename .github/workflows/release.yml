name: Release
on:
 push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: Verify tag commit is on main
            run: |
              git fetch origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::Tag $GITHUB_REF_NAME is not on main. Refusing to release."
                exit 1
              fi
            

          - uses: docker/setup-buildx-action@v3

          - uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Compute image reference
            id: meta
            run: |
              echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/ob-api:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"


          - uses: docker/build-push-action@v6
            with:
              context: .
              platforms: linux/amd64
              push: true
              tags: ${{ steps.meta.outputs.image }}
              cache-from: type=gha
              cache-to: type=gha,mode=max

          - name: Trigger Render deployment
            env:
              HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
              IMAGE: ${{ steps.meta.outputs.image }}
            run: |
              if [ -z "$HOOK" ]; then
                echo "::warning::RENDER_DEPLOY_HOOK_URL not set; image published but not deployed."
                exit 0
              fi
              ENC=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["IMAGE"], safe=""))')
              curl --fail --silent --show-error -X POST "${HOOK}&imgURL=${ENC}" > /dev/null
