name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TeStPaSsWoRd&
          POSTGRES_DB: ogas_book
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:TeStPaSsWoRd&@localhost:5432/ogas_book
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - run: sqlx migrate run --source api/migrations
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: TeStPaSsWoRd&
          POSTGRES_DB: ogas_book
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:TeStPaSsWoRd&@localhost:5432/ogas_book
      API_TEST_DATABASE_URL: postgres://postgres:TeStPaSsWoRd&@localhost:5432/ogas_book
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - run: sqlx migrate run --source api/migrations
      - run: cargo test --workspace

